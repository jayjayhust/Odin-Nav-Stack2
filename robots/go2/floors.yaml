# Multi-floor registry for ONS2 / Unitree Go2.
#
# ${REPO_ROOT} is expanded by floor_manager / mission_manager from `~repo_root`
# (the launch scripts export GO2_ROOT as the fallback).
#
# Every floor needs THREE files with matching stems:
#   <stem>.yaml + <stem>.pgm   -> 2D occupancy grid for map_planner
#   <stem>.bin                 -> Odin1 relocalization map (customer_file/)
#
# A floor is left through a *transition point*. There is no assumption that the
# building has a usable lift API, so three transport types are supported:
#
#   type: lift    - lift lobby (needs an API, a dry-contact bridge, or a human)
#   type: stairs  - stair head; the robot either walks it or is carried/led
#   type: ramp    - ramp foot; usually fully autonomous
#
#   mode: manual      - the robot parks and waits; a human moves it and calls
#                       /floor_manager/arrived_at_floor <floor>
#   mode: api         - mission_manager runs `hook` (async, timeout-guarded);
#                       the hook negotiates with the lift API and finally calls
#                       /floor_manager/arrived_at_floor <floor>
#   mode: autonomous  - the hook makes the robot traverse by itself (e.g. a stair
#                       gait sequence); it must end by calling arrived_at_floor
#
# Stair gait handover is provided by the `stair_gait` package:
#   /stair_gait/enter_climb    -> SwitchGait(3) FORWARD_CLIMBING_MODE
#   /stair_gait/enter_descend  -> SwitchGait(4) REVERSE_CLIMBING_MODE
#   /stair_gait/leave          -> SwitchGait(1) TROT
#   /stair_gait/walkstair_mode -> mode("walkstair")
# The sport API id is NOT in unitree_sdk2's public sport_api.hpp; it is a
# parameter (switch_gait_api_id / mode_api_id) that must be filled in from the
# firmware / SDK actually deployed. Until then keep mode: manual.
#
# Order inside `transitions` is the priority order: the first entry that reaches
# the target floor is used. `to: ""` is a wildcard (works for any other floor).
#
# IMPORTANT: every floor has its own map origin, so the poses below must be
# surveyed PER FLOOR on that floor's own map. They are NOT shared.
#
# `pose` is where the robot parks before crossing: keep it at least 1.2 m clear
# of the lift door / stair head so NeuPAN has room to stop and turn.

default_floor: "1F"

floors:
  - id: "1F"
    name: "一层"
    map_yaml: "${REPO_ROOT}/ros_ws/src/map_planner/maps/floor1.yaml"
    reloc_bin: "${REPO_ROOT}/customer_file/floor1.bin"
    transitions:
      # Stair head first: this building gives no lift API.
      - to: ""
        type: stairs
        mode: manual                       # human leads the dog, then confirms
        pose: {x: 1.20, y: -2.60, yaw: 1.57}
        # After the stair climb is validated on site, switch to:
        #   mode: autonomous
        #   hook: "scripts/transition/stairs_gait_hook.sh"
        # and start stair_gait with enable_actuation:=true plus a valid
        # switch_gait_api_id. The generic template stairs_auto_example.sh is
        # kept for SDKs that expose a shell entry point instead.
      # Lift kept as a fallback (dry contact / staff with a lift card).
      - to: ""
        type: lift
        mode: manual
        pose: {x: 6.20, y: 1.80, yaw: 0.00}

  - id: "2F"
    name: "二层"
    map_yaml: "${REPO_ROOT}/ros_ws/src/map_planner/maps/floor2.yaml"
    reloc_bin: "${REPO_ROOT}/customer_file/floor2.bin"
    transitions:
      - to: ""
        type: stairs
        mode: manual                       # autonomous: stairs_gait_hook.sh
        pose: {x: 1.35, y: -2.45, yaw: 1.57}
      - to: ""
        type: lift
        mode: manual
        pose: {x: 6.10, y: 1.85, yaw: 0.00}

  - id: "3F"
    name: "三层"
    map_yaml: "${REPO_ROOT}/ros_ws/src/map_planner/maps/floor3.yaml"
    reloc_bin: "${REPO_ROOT}/customer_file/floor3.bin"
    transitions:
      - to: ""
        type: stairs
        mode: manual                       # autonomous: stairs_gait_hook.sh
        pose: {x: 1.35, y: -2.45, yaw: 1.57}
      - to: ""
        type: lift
        mode: manual
        pose: {x: 6.10, y: 1.85, yaw: 0.00}

  - id: "4F"
    name: "四层"
    map_yaml: "${REPO_ROOT}/ros_ws/src/map_planner/maps/floor4.yaml"
    reloc_bin: "${REPO_ROOT}/customer_file/floor4.bin"
    transitions:
      - to: ""
        type: stairs
        mode: manual                       # autonomous: stairs_gait_hook.sh
        pose: {x: 1.35, y: -2.45, yaw: 1.57}
      - to: ""
        type: lift
        mode: manual
        pose: {x: 6.10, y: 1.85, yaw: 0.00}
