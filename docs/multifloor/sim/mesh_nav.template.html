<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>导入 mesh · 全局导航规划</title>
<style>
  :root{--bg:#070d15;--fg:#dbe6f4;--dim:#7f93ad;--line:#1c2b3d;--acc:#4fc3ff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.5 -apple-system,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif}
  .hd{padding:22px 28px 10px}
  .hd h1{margin:0 0 6px;font-size:22px;letter-spacing:.4px}
  .hd p{margin:0;color:var(--dim);font-size:13px}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 28px 12px;border-bottom:1px solid var(--line)}
  .grp{display:flex;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#0c151f}
  .grp button{border:0;background:transparent;color:var(--dim);padding:8px 14px;font-size:13px;cursor:pointer;font-family:inherit}
  .grp button:hover{color:#fff}
  .grp button.on{background:#17324a;color:#fff}
  .btn{border:1px solid var(--line);background:#0c151f;color:var(--fg);border-radius:9px;padding:8px 14px;font-size:13px;cursor:pointer;font-family:inherit}
  .btn:hover{border-color:#2e4a68}
  .btn.primary{background:#123b5c;border-color:#1d5c8c;color:#eaf6ff}
  .btn.primary:hover{background:#164b73}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  select{background:#0c151f;color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px;font-family:inherit}
  .lbl{color:var(--dim);font-size:12.5px}
  .val{color:var(--acc);font-variant-numeric:tabular-nums}
  #cv{height:min(62vh,640px);margin:14px 28px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative}
  #hud{position:absolute;left:14px;top:14px;padding:12px 14px;border-radius:10px;
       background:rgba(8,15,24,.82);border:1px solid #1a2a3d;font-size:12.5px;line-height:1.7;max-width:330px}
  #hud b{color:#fff}
  #hud .k{color:var(--dim)} #hud .v{color:var(--acc);font-variant-numeric:tabular-nums}
  #say{position:absolute;right:14px;bottom:14px;padding:8px 12px;border-radius:9px;
       background:rgba(8,15,24,.85);border:1px solid #1a2a3d;font-size:12.5px;color:#cfe3f7;max-width:420px}
  .legend{display:flex;gap:18px;flex-wrap:wrap;padding:12px 28px 4px;font-size:12.5px;color:var(--dim)}
  .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:1px}
  .foot{padding:8px 28px 26px;color:#6a7c92;font-size:12.5px}
  .foot b{color:#9db2c9;font-weight:600}
</style>
</head>
<body>

<div class="hd">
  <h1>导入 mesh · 全局导航规划</h1>
  <p>载入任意 OBJ / STL 模型（含多层楼梯），页面自己判定哪是地板、哪是墙，然后在可通行面上做 3D A*。</p>
</div>

<div class="bar">
  <input type="file" id="file" accept=".obj,.stl,.txt" style="display:none">
  <button class="btn primary" id="pick">选择模型文件…</button>
  <button class="btn" id="demo">示例 · 四层带楼梯</button>
  <span class="lbl">分辨率</span>
  <select id="res"><option value="0.10">0.10 m</option><option value="0.15" selected>0.15 m</option><option value="0.20">0.20 m</option><option value="0.30">0.30 m</option></select>
  <span class="lbl">膨胀</span>
  <select id="inf"><option value="0.00">0 m</option><option value="0.30" selected>0.30 m</option><option value="0.45">0.45 m</option><option value="0.60">0.60 m</option></select>
  <button class="btn" id="setStart">点模型设起点</button>
  <button class="btn" id="setGoal">点模型设终点</button>
  <button class="btn primary" id="go" disabled>规划</button>
  <button class="btn" id="clear">清空</button>
</div>

<div class="legend">
  <span><span class="sw" style="background:#ffcf3f"></span>可通行面</span>
  <span><span class="sw" style="background:#ff5a5a"></span>膨胀后的墙 / 不可走</span>
  <span><span class="sw" style="background:#4fc3ff"></span>全局路径</span>
  <span><span class="sw" style="background:#5ce0a3"></span>起点</span>
  <span><span class="sw" style="background:#ff8fb1"></span>终点</span>
  <span><span class="sw" style="background:#8fa3bb"></span>原始模型</span>
</div>

<div id="cv">
  <div id="hud">等待载入模型</div>
  <div id="say">先点「示例」看效果，也可以直接选自己的 OBJ / STL 文件</div>
</div>

<div class="foot">
  <b>怎么判定可走：</b>三角面按法向分成水平面与竖直面——水平面给「这一列有地板，站在这个高度」，竖直面投影到 XY 后按膨胀半径做距离场，靠近墙的格子禁行。相邻两列的高度差超过 0.30 m 就走不过去，所以楼梯是一级一级上得去的，而楼板与楼板之间那 3.42 m 走不过去。
</div>

<script>/*__THREE__*/</script>
<script>
const DATA_OBJ = /*__OBJ__*/;

// ---------- scene ----------------------------------------------------------
const host = document.getElementById('cv');
const W = () => host.clientWidth, H = () => host.clientHeight;
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
renderer.setSize(W(), H());
renderer.setClearColor(0x070d15, 1);
host.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, W() / H(), 0.05, 600);
const ORIGIN = new THREE.Vector3(0, 0, 0);
camera.up.set(0, 0, 1);
scene.add(new THREE.HemisphereLight(0xbcd6f2, 0x101820, 1.0));
const sun = new THREE.DirectionalLight(0xffffff, 1.05);
sun.position.set(8, -12, 22);
scene.add(sun);
const rim = new THREE.DirectionalLight(0x8fc3ff, 0.45);
rim.position.set(-14, 10, 6);
scene.add(rim);

let cam = {yaw: -0.9, pitch: 0.42, dist: 30, target: new THREE.Vector3()};
function applyCam(){
  const cp = Math.cos(cam.pitch);
  camera.position.set(
    cam.target.x + cam.dist * cp * Math.cos(cam.yaw),
    cam.target.y + cam.dist * cp * Math.sin(cam.yaw),
    cam.target.z + cam.dist * Math.sin(cam.pitch));
  camera.lookAt(cam.target);
}
applyCam();

// ---------- state ----------------------------------------------------------
const state = {
  mode: null,          // 'start' | 'goal' | null
  map: null,           // built map
  start: null, goal: null, path: null,
  res: 0.15, inf: 0.45,
};

let root = new THREE.Group();
scene.add(root);
let srcMesh = null, walkMesh = null, wallMesh = null, pathLine = null;
let markStart = null, markGoal = null, rays = 0;

// ---------- OBJ / STL ------------------------------------------------------
function parseOBJ(text){
  const pos = [], idx = [];
  const lines = text.split('\n');
  for (let i = 0; i < lines.length; ++i){
    const ln = lines[i];
    if (ln.length < 2) continue;
    const c0 = ln[0], c1 = ln[1];
    if (c0 === 'v' && (c1 === ' ' || c1 === '\t')){
      const a = ln.trim().split(/\s+/);
      pos.push(+a[1], +a[2], +a[3]);
    } else if (c0 === 'f' && (c1 === ' ' || c1 === '\t')){
      const a = ln.trim().split(/\s+/);
      const vs = [];
      for (let k = 1; k < a.length; ++k){
        const s = a[k].split('/')[0];
        const n = parseInt(s, 10);
        vs.push(n > 0 ? n - 1 : pos.length / 3 + n);
      }
      for (let k = 1; k + 1 < vs.length; ++k) idx.push(vs[0], vs[k], vs[k+1]);
    }
  }
  return {pos: new Float32Array(pos), idx: new Uint32Array(idx)};
}

function parseSTL(buf){
  const dv = new DataView(buf);
  // binary if the header says so and the count matches the file size
  const maybe = dv.getUint32(80, true);
  if (80 + 4 + maybe * 50 === buf.byteLength){
    const pos = new Float32Array(maybe * 9), idx = new Uint32Array(maybe * 3);
    let o = 84;
    for (let f = 0; f < maybe; ++f){
      o += 12;                                    // normal, recomputed later
      for (let v = 0; v < 3; ++v){
        pos[9*f + 3*v]     = dv.getFloat32(o, true);
        pos[9*f + 3*v + 1] = dv.getFloat32(o + 4, true);
        pos[9*f + 3*v + 2] = dv.getFloat32(o + 8, true);
        idx[3*f + v] = 3*f + v;
        o += 12;
      }
      o += 2;
    }
    return {pos, idx};
  }
  // ascii
  const text = new TextDecoder().decode(buf);
  const pos = [], idx = [];
  const re = /vertex\s+([-\d.eE+]+)\s+([-\d.eE+]+)\s+([-\d.eE+]+)/g;
  let m;
  while ((m = re.exec(text))){ pos.push(+m[1], +m[2], +m[3]); }
  for (let i = 0; i + 2 < pos.length / 3; i += 3){ idx.push(i, i+1, i+2); }
  return {pos: new Float32Array(pos), idx: new Uint32Array(idx)};
}

// ---------- map: surface voxels, inflation, ground support ----------------
// This page does not invent a planner. The map and the search below are ports
// of ros_ws/src/octo_planner_ros1/src/voxel_grid.cpp and astar3d.cpp, so a
// mesh imported here is read the same way a point cloud from Odin1 is:
//
//   - only surface samples are marked occupied, nothing is filled solid;
//   - clearance is stamped only above a face that points up, which is what
//     keeps a slab from being walked through;
//   - inflation is a flat XY disk with no z extent, inflate(2, 0);
//   - a cell is standable only if something solid sits under it.
const UNKNOWN = 0, FREE = 1, OCC = 2, INFL = 3;
const CLEARANCE = 20;          // voxel_grid.cpp: insertSurfacePoint(..., 20)
const MAX_STEP_Z = 3;          // nav_sim.cpp: max_step_z_cells = 3
const SNAP_R = 12;             // nav_sim.cpp: snap_search_radius_cells = 12

function buildMap(pos, idx, res, infR){
  const pad = 0.6;
  let lo = [1e9, 1e9, 1e9], hi = [-1e9, -1e9, -1e9];
  for (let i = 0; i < pos.length; i += 3){
    for (let a = 0; a < 3; ++a){
      const v = pos[i+a];
      if (v < lo[a]) lo[a] = v;
      if (v > hi[a]) hi[a] = v;
    }
  }
  if (lo[0] > hi[0]) return null;
  for (let a = 0; a < 3; ++a){ lo[a] -= pad; hi[a] += pad; }
  const nx = Math.ceil((hi[0]-lo[0])/res)+1, ny = Math.ceil((hi[1]-lo[1])/res)+1,
        nz = Math.ceil((hi[2]-lo[2])/res)+1;
  const cells = nx*ny*nz;
  if (cells > 40e6) return {tooBig:true, nx, ny, nz, lo, cellCount:cells};
  const data = new Uint8Array(cells);          // UNKNOWN everywhere, like configure()
  const F = (i, j, k) => (k*ny + j)*nx + i;    // voxel_grid.cpp: flatten()

  function insertOne(ix, iy, iz, upwardClear){
    if (ix < 0 || iy < 0 || iz < 0 || ix >= nx || iy >= ny || iz >= nz) return;
    data[F(ix, iy, iz)] = OCC;
    if (!upwardClear) return;
    for (let d = 1; d <= CLEARANCE; ++d){
      const k = iz + d;
      if (k >= nz) break;
      const f = F(ix, iy, k);
      if (data[f] === UNKNOWN) data[f] = FREE;
    }
  }
  // nav_sim stamps a floor return over its 3x3 neighbourhood, because the
  // samples are sparse against the cell size and the floor is a continuous
  // plane - filling that gap cannot hide an obstacle. Without it the plate
  // arrives as a sieve, the 5x5 support test counts under 8 cells and most of
  // the storey is rejected as unsupported.
  function insert(x, y, z, upwardClear){
    const ix = Math.floor((x-lo[0])/res), iy = Math.floor((y-lo[1])/res),
          iz = Math.floor((z-lo[2])/res);
    insertOne(ix, iy, iz, upwardClear);
    if (!upwardClear) return;
    for (let dy = -1; dy <= 1; ++dy)
      for (let dx = -1; dx <= 1; ++dx){
        if (!dx && !dy) continue;
        insertOne(ix+dx, iy+dy, iz, true);
      }
  }

  // Sample every triangle on a 0.8 cell lattice, and stamp clearance only
  // under an upward normal. A slab's underside carries a downward normal and
  // must not open the floor above it, or the search would go straight through
  // a storey instead of up the stairs.
  const step = res*0.8;
  const vA = [0,0,0], vB = [0,0,0], vC = [0,0,0];
  for (let t = 0; t < idx.length; t += 3){
    const ia = idx[t]*3, ib = idx[t+1]*3, ic = idx[t+2]*3;
    vA[0] = pos[ia]; vA[1] = pos[ia+1]; vA[2] = pos[ia+2];
    vB[0] = pos[ib]; vB[1] = pos[ib+1]; vB[2] = pos[ib+2];
    vC[0] = pos[ic]; vC[1] = pos[ic+1]; vC[2] = pos[ic+2];
    const e1 = [vB[0]-vA[0], vB[1]-vA[1], vB[2]-vA[2]];
    const e2 = [vC[0]-vA[0], vC[1]-vA[1], vC[2]-vA[2]];
    const nX = e1[1]*e2[2] - e1[2]*e2[1];
    const nY = e1[2]*e2[0] - e1[0]*e2[2];
    const nZ = e1[0]*e2[1] - e1[1]*e2[0];
    const nl = Math.hypot(nX, nY, nZ) || 1;
    const up = (nZ/nl) > 0.35;
    const L = Math.max(Math.hypot(e1[0], e1[1], e1[2]),
                       Math.hypot(e2[0], e2[1], e2[2]));
    const n = Math.min(64, Math.max(1, Math.ceil(L/step)));
    for (let u = 0; u <= n; ++u){
      for (let v = 0; v + u <= n; ++v){
        const a = u/n, b = v/n;
        insert(vA[0] + a*e1[0] + b*e2[0],
               vA[1] + a*e1[1] + b*e2[1],
               vA[2] + a*e1[2] + b*e2[2], up);
      }
    }
  }

  // hasGroundSupport, transposed from voxel_grid.cpp with xy radius 0: the
  // cell below must be occupied, and a one cell thick sheet is only accepted
  // when it is a real horizontal face rather than a wall hit on one layer.
  function support(ix, iy, iz){
    const zl = iz - 1;
    if (zl < 0) return false;
    if (data[F(ix, iy, zl)] !== OCC) return false;
    if (zl - 1 >= 0 && data[F(ix, iy, zl-1)] === FREE){
      let span = 0;
      for (let sy = -2; sy <= 2; ++sy)
        for (let sx = -2; sx <= 2; ++sx){
          const i2 = ix + sx, j2 = iy + sy;
          if (i2 < 0 || j2 < 0 || i2 >= nx || j2 >= ny) continue;
          if (data[F(i2, j2, zl)] === OCC) ++span;
        }
      if (span < 8) return false;
    }
    return true;
  }

  // nav_sim runs with allow_unknown_cells, and that is what makes a staircase
  // plannable at all: a tread hangs in the air with nothing under it because
  // no ground return was ever measured there. An unknown cell underneath is
  // accepted optimistically and settled by the local planner on arrival.
  function supportOrUnknown(ix, iy, iz){
    if (iz - 1 >= 0 && data[F(ix, iy, iz-1)] === UNKNOWN) return true;
    return support(ix, iy, iz);
  }

  // inflate(rxy, 0): a flat disk, never any z extent. Stair runs are exempt,
  // the same carve-out nav_sim makes for a stair core - a 0.30 m tread cannot
  // survive a 0.20 m side expansion from the next riser. A column counts as
  // stair when four or more of its occupied cells sit within three layers of
  // each other, which is a flight and never a floor plate.
  const rxy = Math.max(0, Math.round(infR/res));
  if (rxy > 0){
    const exempt = new Uint8Array(nx*ny);
    for (let j = 0; j < ny; ++j)
      for (let i = 0; i < nx; ++i){
        let run = 0, last = -99;
        for (let k = 0; k < nz; ++k){
          if (data[F(i, j, k)] !== OCC) continue;
          run = (k - last <= MAX_STEP_Z) ? run + 1 : 1;
          last = k;
          if (run >= 4){ exempt[i + j*nx] = 1; break; }
        }
      }
    const occ = [];
    for (let f = 0; f < cells; ++f) if (data[f] === OCC) occ.push(f);
    for (let oi = 0; oi < occ.length; ++oi){
      const f = occ[oi];
      const k = (f / (nx*ny)) | 0, rem = f - k*nx*ny;
      const j = (rem / nx) | 0, i = rem - j*nx;
      if (exempt[i + j*nx]) continue;
      for (let dj = -rxy; dj <= rxy; ++dj){
        const jj = j + dj;
        if (jj < 0 || jj >= ny) continue;
        for (let di = -rxy; di <= rxy; ++di){
          if (di*di + dj*dj > rxy*rxy) continue;
          const ii = i + di;
          if (ii < 0 || ii >= nx) continue;
          const ff = F(ii, jj, k);
          if (data[ff] === FREE) data[ff] = INFL;
        }
      }
    }
  }

  // bounds of standable cells, for the camera and the HUD
  let zmin = 1e30, zmax = -1e30, nStand = 0, nInfl = 0;
  for (let k = 0; k < nz; ++k)
    for (let j = 0; j < ny; ++j)
      for (let i = 0; i < nx; ++i){
        const v = data[F(i, j, k)];
        if (v !== FREE && v !== INFL) continue;
        if (k < 1 || !support(i, j, k)) continue;
        ++nStand;
        if (v === INFL) ++nInfl;
        const wz = lo[2] + (k+0.5)*res;
        if (wz < zmin) zmin = wz;
        if (wz > zmax) zmax = wz;
      }
  return {res, infR, lo, nx, ny, nz, data, cells, support, supportOrUnknown, nStand, nInfl,
          zmin: zmin > 1e29 ? 0 : zmin, zmax: zmax < -1e29 ? 0 : zmax,
          tooBig: false};
}

// ---------- 3D A*, same rules as astar3d.cpp -------------------------------
const fmt3 = v => '[' + v.map(x => (+x).toFixed(2)).join(',') + ']';
function planPath(m, sx, sy, sz, gx, gy, gz){
  const {res, lo, nx, ny, nz, data} = m;
  const supportOrUnknown = m.supportOrUnknown;
  const F = (i, j, k) => (k*ny + j)*nx + i;
  const cells = m.cells;
  const traversable = (i, j, k) =>
    i >= 0 && j >= 0 && k >= 0 && i < nx && j < ny && k < nz && data[F(i, j, k)] === FREE;

  // nearestWalkable, allow_inflated = false: prefer a genuinely free cell, or
  // every neighbour of the start is inflated and the search expands once.
  function snap(x, y, z){
    const i0 = Math.floor((x-lo[0])/res), j0 = Math.floor((y-lo[1])/res),
          k0 = Math.floor((z-lo[2])/res);
    let best = -1, bd = 1e30;
    for (let dk = -SNAP_R; dk <= SNAP_R; ++dk)
      for (let dj = -SNAP_R; dj <= SNAP_R; ++dj)
        for (let di = -SNAP_R; di <= SNAP_R; ++di){
          const i = i0+di, j = j0+dj, k = k0+dk;
          if (!traversable(i, j, k)) continue;
          const d2 = di*di + dj*dj + dk*dk;
          if (d2 < bd){ bd = d2; best = F(i, j, k); }
        }
    return best;
  }

  const startId = snap(sx, sy, sz), goalId = snap(gx, gy, gz);
  if (startId < 0 || goalId < 0)
    return {error: (startId < 0 ? '起点' : '终点') + ' 附近 ' + SNAP_R +
      ' 格内没有可通行格子（膨胀把这一片吃掉了，把膨胀调小或设 0）'};

  const goalI = goalId % nx, goalJ = ((goalId / nx) | 0) % ny,
        goalK = (goalId / (nx*ny)) | 0;

  const gScore = new Float32Array(cells).fill(1e30);
  const from = new Int32Array(cells).fill(-1);
  const closed = new Uint8Array(cells);
  const openF = new Float32Array(cells << 3);
  const openId = new Int32Array(cells << 3);
  let heapN = 0;
  function push(f, id){
    let i = heapN++;
    openF[i] = f; openId[i] = id;
    while (i > 0){
      const p = (i-1) >> 1;
      if (openF[p] <= openF[i]) break;
      const tf = openF[p], ti = openId[p];
      openF[p] = openF[i]; openId[p] = openId[i];
      openF[i] = tf; openId[i] = ti;
      i = p;
    }
  }
  function pop(){
    const id = openId[0];
    const f = openF[--heapN];
    const i2 = openId[heapN];
    if (heapN > 0){
      let i = 0;
      openF[0] = f; openId[0] = i2;
      for (;;){
        const l = i*2+1, r = l+1;
        let s = i;
        if (l < heapN && openF[l] < openF[s]) s = l;
        if (r < heapN && openF[r] < openF[s]) s = r;
        if (s === i) break;
        const tf = openF[s], ti = openId[s];
        openF[s] = openF[i]; openId[s] = openId[i];
        openF[i] = tf; openId[i] = ti;
        i = s;
      }
    }
    return id;
  }
  const heur = (i, j, k) => res*Math.hypot(i-goalI, j-goalJ, k-goalK);

  gScore[startId] = 0;
  push(heur(startId % nx, ((startId/nx)|0) % ny, (startId/(nx*ny))|0), startId);
  let expanded = 0, foundCell = -1;
  while (heapN > 0){
    const cur = pop();
    if (closed[cur]) continue;
    closed[cur] = 1;
    if (++expanded > 400000) break;

    const ci = cur % nx, cj = ((cur/nx)|0) % ny, ck = (cur/(nx*ny))|0;
    // Accept a cell adjacent to the goal, like astar3d does: the goal is
    // rarely voxel aligned.
    if (Math.abs(ci-goalI) <= 1 && Math.abs(cj-goalJ) <= 1 && Math.abs(ck-goalK) <= 1){
      foundCell = cur;
      break;
    }

    for (let dk = -MAX_STEP_Z; dk <= MAX_STEP_Z; ++dk){
      const k = ck + dk;
      if (k < 0 || k >= nz) continue;
      for (let dj = -1; dj <= 1; ++dj){
        const j = cj + dj;
        if (j < 0 || j >= ny) continue;
        for (let di = -1; di <= 1; ++di){
          if (di === 0 && dj === 0 && dk === 0) continue;
          // A pure vertical step is never a way up in a building: it only
          // shows up where a sparse surface leaves a hole in the layer above.
          if (dk !== 0 && di === 0 && dj === 0) continue;
          const i = ci + di;
          if (i < 0 || i >= nx) continue;
          const nf = F(i, j, k);
          if (closed[nf]) continue;
          if (!traversable(i, j, k)) continue;
          if (k < 1 || !supportOrUnknown(i, j, k)) continue;
          const step = res*Math.hypot(di, dj, dk);
          const tentative = gScore[cur] + step;
          if (tentative >= gScore[nf]) continue;
          gScore[nf] = tentative;
          from[nf] = cur;
          push(tentative + heur(i, j, k), nf);
        }
      }
    }
  }

  if (foundCell < 0)
    return {error: '没有可通行的路线：起 ' + fmt3([sx,sy,sz]) + ' 终 ' + fmt3([gx,gy,gz]) +
      '，展开 ' + expanded + ' 个节点'};

  const pts = [];
  let c = foundCell;
  while (c >= 0){
    const i = c % nx, j = ((c/nx)|0) % ny, k = (c/(nx*ny))|0;
    pts.push([lo[0] + (i+0.5)*res, lo[1] + (j+0.5)*res, lo[2] + (k+0.5)*res]);
    if (c === startId) break;
    c = from[c];
  }
  pts.reverse();
  let len = 0;
  for (let i2 = 1; i2 < pts.length; ++i2)
    len += Math.hypot(pts[i2][0]-pts[i2-1][0], pts[i2][1]-pts[i2-1][1], pts[i2][2]-pts[i2-1][2]);
  return {pts, len, expanded};
}
// ---------- drawing -------------------------------------------------------
const COL_FLOOR = 0xffcf3f, COL_WALL = 0xff5a5a, COL_PATH = 0x4fc3ff;
const COL_S = 0x5ce0a3, COL_G = 0xff8fb1;

function clearRoot(){
  while (root.children.length){
    const o = root.children.pop();
    o.traverse(c => { if (c.geometry) c.geometry.dispose(); if (c.material && c.material.dispose) c.material.dispose(); });
  }
  srcMesh = walkMesh = wallMesh = pathLine = null;
  markStart = markGoal = null;
}

function makeSrcMesh(pos, idx){
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setIndex(new THREE.BufferAttribute(idx, 1));
  g.computeVertexNormals();
  const m = new THREE.MeshStandardMaterial({
    color: 0x8fa3bb, transparent: true, opacity: 0.42, roughness: 0.9,
    metalness: 0.05, side: THREE.DoubleSide, depthWrite: false});
  const mesh = new THREE.Mesh(g, m);
  mesh.renderOrder = 2;
  return mesh;
}

function makePlanes(m){
  const {res, lo, nx, ny, nz, data} = m;
  const support = m.supportOrUnknown;
  const F = (i, j, k) => (k*ny + j)*nx + i;
  // Only the cells the dog could stand on: free or inflated, with support
  // under them. Inflated cells are drawn red, which is the whole point -
  // it shows exactly which standable surface the 0.2 m band costs you.
  const ids = [], inf = [];
  for (let k = 0; k < nz; ++k)
    for (let j = 0; j < ny; ++j)
      for (let i = 0; i < nx; ++i){
        const v = data[F(i, j, k)];
        if (v !== FREE && v !== INFL) continue;
        if (k < 1 || !support(i, j, k)) continue;
        (v === INFL ? inf : ids).push(F(i, j, k));
      }
  const quad = new THREE.PlaneGeometry(res*0.92, res*0.92);
  const tot = ids.length + inf.length;
  const walk = new THREE.InstancedMesh(quad, new THREE.MeshBasicMaterial({
    color: 0xffffff, transparent: true, opacity: 0.55}), Math.max(1, tot));
  walk.renderOrder = 3;
  const dum = new THREE.Object3D();
  const cWalk = new THREE.Color(COL_FLOOR), cWall = new THREE.Color(COL_WALL), tmp = new THREE.Color();
  const all = ids.concat(inf);
  for (let n = 0; n < all.length; ++n){
    const f = all[n];
    const k = (f / (nx*ny)) | 0, rem = f - k*nx*ny;
    const j = (rem / nx) | 0, i = rem - j*nx;
    dum.position.set(lo[0] + (i+0.5)*res, lo[1] + (j+0.5)*res, lo[2] + (k+0.5)*res + 0.004);
    dum.rotation.set(0, 0, 0);
    dum.scale.set(1, 1, 1);
    dum.updateMatrix();
    walk.setMatrixAt(n, dum.matrix);
    tmp.copy(n < ids.length ? cWalk : cWall);
    walk.setColorAt(n, tmp);
  }
  walk.count = all.length;
  walk.instanceMatrix.needsUpdate = true;
  return walk;
}

function makeBall(p, color){
  const g = new THREE.SphereGeometry(0.16, 16, 12);
  const m = new THREE.MeshBasicMaterial({color, transparent: true, opacity: 0.95});
  const s = new THREE.Mesh(g, m);
  s.position.set(p[0], p[1], p[2] + 0.1);
  s.renderOrder = 9;
  return s;
}

function makeDog(p){
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.20, 0.12),
                    new THREE.MeshStandardMaterial({color: 0xd9e6f5, roughness: 0.6}));
  body.position.z = 0.30;
  g.add(body);
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.14, 0.12),
                    new THREE.MeshStandardMaterial({color: 0xbfd2e6}));
  head.position.set(0.26, 0, 0.32);
  g.add(head);
  const legM = new THREE.MeshStandardMaterial({color: 0x9fb4ca});
  [[0.14,0.08],[0.14,-0.08],[-0.14,0.08],[-0.14,-0.08]].forEach(([x, y]) => {
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.02, 0.30, 8), legM);
    leg.position.set(x, y, 0.15);
    g.add(leg);
  });
  g.position.set(p[0], p[1], p[2]);
  return g;
}

// ---------- load --------------------------------------------------------
function showHud(html){ document.getElementById('hud').innerHTML = html; }
function say(t){ document.getElementById('say').textContent = t; }

function loadModel(pos, idx, name){
  clearRoot();
  state.start = state.goal = state.path = null;
  const sp = pos.length / 3;
  if (!sp){ say('这个文件里没有三角面'); return; }
  srcMesh = makeSrcMesh(pos, idx);
  root.add(srcMesh);

  const res = +document.getElementById('res').value;
  const infR = +document.getElementById('inf').value;
  state.res = res; state.inf = infR;
  const t0 = performance.now();
  const m = buildMap(pos, idx, res, infR);
  if (!m){ say('模型读取失败'); return; }
  if (m.tooBig){
    say('模型太大：' + m.nx + '×' + m.ny + '×' + m.nz + ' 格，换大一点的分辨率再试');
    showHud('<b>' + name + '</b><br><span class="k">格数超限</span>');
    return;
  }
  state.map = m;
  walkMesh = makePlanes(m);
  root.add(walkMesh);

  // frame
  const cx = m.lo[0] + m.nx * res / 2, cy = m.lo[1] + m.ny * res / 2;
  const zmin = m.zmin, zmax = m.zmax;
  cam.target.set(cx, cy, (zmin + zmax) / 2);
  cam.dist = Math.max(6, Math.max(m.nx * res, m.ny * res, (zmax - zmin) * 1.2) * 1.9);
  applyCam();

  const ms = performance.now() - t0;
  showHud('<b>' + name + '</b><br>' +
    '<span class="k">三角面</span> <span class="v">' + (idx.length/3).toLocaleString() + '</span> · ' +
    '<span class="k">可站格</span> <span class="v">' + m.nStand.toLocaleString() + '</span> · ' +
    '<span class="k">膨胀吃掉</span> <span class="v">' + m.nInfl.toLocaleString() + '</span><br>' +
    '<span class="k">格</span> <span class="v">' + m.nx + '×' + m.ny + '×' + m.nz + '</span> · ' +
    '<span class="k">分辨率</span> <span class="v">' + res + ' m</span><br>' +
    '<span class="k">膨胀</span> <span class="v">' + infR + ' m</span> · ' +
    '<span class="k">建图</span> <span class="v">' + Math.round(ms) + ' ms</span><br>' +
    '<span class="k">可走高度</span> <span class="v">' + (zmin).toFixed(2) + ' … ' + (zmax).toFixed(2) + ' m</span>');
  document.getElementById('go').disabled = !(state.start && state.goal);
  say('点「点模型设起点」，在模型上点一下');
}

document.getElementById('demo').onclick = () => {
  const o = parseOBJ(DATA_OBJ);
  loadModel(o.pos, o.idx, '示例 · 四层办公楼');
};

document.getElementById('pick').onclick = () => document.getElementById('file').click();
document.getElementById('file').onchange = e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    let o;
    if (/\.stl$/i.test(f.name)){
      o = parseSTL(r.result);
    } else {
      o = parseOBJ(r.result);
    }
    loadModel(o.pos, o.idx, f.name);
  };
  if (/\.stl$/i.test(f.name)) r.readAsArrayBuffer(f);
  else r.readAsText(f);
};

document.getElementById('res').onchange = () => {
  if (!srcMesh) return;
  const g = srcMesh.geometry;
  const pos = g.attributes.position.array, idx = g.index ? g.index.array : null;
  loadModel(new Float32Array(pos), new Uint32Array(idx), 'reload');
};

document.getElementById('inf').onchange = () => {
  if (!srcMesh) return;
  const g = srcMesh.geometry;
  const pos = g.attributes.position.array, idx = g.index ? g.index.array : null;
  loadModel(new Float32Array(pos), new Uint32Array(idx), 'reload');
};

// ---------- picking -------------------------------------------------------
const ray = new THREE.Raycaster();
function pick(ev){
  const r = host.getBoundingClientRect();
  const nx = ((ev.clientX - r.left) / r.width) * 2 - 1;
  const ny = -((ev.clientY - r.top) / r.height) * 2 + 1;
  ray.setFromCamera({x: nx, y: ny}, camera);
  const hit = ray.intersectObject(srcMesh, false)[0];
  return hit ? hit.point : null;
}

host.addEventListener('click', ev => {
  if (!state.mode) return;
  const p = pick(ev);
  if (!p){ say('没点到模型上'); return; }
  if (state.mode === 'start'){
    state.start = [p.x, p.y, p.z];
    if (markStart) { root.remove(markStart); markStart.geometry.dispose(); }
    markStart = makeBall(state.start, COL_S);
    root.add(markStart);
  } else {
    state.goal = [p.x, p.y, p.z];
    if (markGoal) { root.remove(markGoal); markGoal.geometry.dispose(); }
    markGoal = makeBall(state.goal, COL_G);
    root.add(markGoal);
  }
  state.mode = null;
  say('起点 (' + state.start.map(v => v.toFixed(2)).join(', ') + ')  终点 ' +
      (state.goal ? '(' + state.goal.map(v => v.toFixed(2)).join(', ') + ')' : '未设'));
  document.getElementById('go').disabled = !(state.start && state.goal);
});

document.getElementById('setStart').onclick = () => { state.mode = 'start'; say('在地板上点一下，设起点'); };
document.getElementById('setGoal').onclick  = () => { state.mode = 'goal';  say('在目标楼层的地板上点一下，设终点'); };

document.getElementById('go').onclick = () => {
  if (!state.map || !state.start || !state.goal) return;
  const t0 = performance.now();
  const r = planPath(state.map, state.start[0], state.start[1], state.start[2] + 0.05,
                                state.goal[0],  state.goal[1],  state.goal[2]  + 0.05);
  const ms = performance.now() - t0;
  if (r.error){ say(r.error); return; }
  state.path = r.pts;
  if (pathLine){ root.remove(pathLine); pathLine.geometry.dispose(); }
  const pp = new Float32Array(r.pts.length * 3);
  for (let i = 0; i < r.pts.length; ++i){
    pp[3*i] = r.pts[i][0]; pp[3*i+1] = r.pts[i][1]; pp[3*i+2] = r.pts[i][2] + 0.06;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pp, 3));
  pathLine = new THREE.Line(g, new THREE.LineBasicMaterial({
    color: COL_PATH, transparent: true, opacity: 0.98, depthTest: false, depthWrite: false}));
  pathLine.renderOrder = 10;
  root.add(pathLine);
  say('路径 ' + r.pts.length + ' 点 · ' + r.len.toFixed(1) + ' m · A* ' +
      Math.round(ms) + ' ms · 展开 ' + r.expanded + ' 节点');
};

document.getElementById('clear').onclick = () => {
  clearRoot();
  state.map = state.start = state.goal = state.path = null;
  showHud('等待载入模型');
  say('先点「示例」看效果，也可以直接选自己的 OBJ / STL 文件');
  document.getElementById('go').disabled = true;
};

// ---------- orbit --------------------------------------------------------
let drag = null;
host.addEventListener('pointerdown', e => {
  if (e.button === 2) drag = {pan: true, x: e.clientX, y: e.clientY, tx: cam.target.x, ty: cam.target.y};
  else if (e.button === 0 && !state.mode) drag = {rot: true, x: e.clientX, y: e.clientY, yaw: cam.yaw, pitch: cam.pitch};
});
window.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (drag.rot){
    cam.yaw = drag.yaw - dx * 0.006;
    cam.pitch = Math.max(-0.25, Math.min(1.45, drag.pitch + dy * 0.005));
  } else if (drag.pan){
    const s = cam.dist * 0.0016;
    cam.target.x = drag.tx - Math.sin(cam.yaw) * dx * s;
    cam.target.y = drag.ty + Math.cos(cam.yaw) * dx * s;
  }
  applyCam();
});
window.addEventListener('pointerup', () => drag = null);
host.addEventListener('wheel', e => {
  e.preventDefault();
  cam.dist = Math.max(2, Math.min(300, cam.dist * (1 + Math.sign(e.deltaY) * 0.08)));
  applyCam();
}, {passive: false});
host.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('resize', () => {
  renderer.setSize(W(), H());
  camera.aspect = W() / H();
  camera.updateProjectionMatrix();
});

// ---------- tick ---------------------------------------------------------
let spin = 0;
function tick(){
  requestAnimationFrame(tick);
  spin += 0.0012;
  if (!drag) { /* no idle motion: the scene is a map, not a turntable */ }
  renderer.render(scene, camera);
}
tick();

// hash: #demo loads the sample and plans from the lowest storey to the
// highest, so one screenshot proves the whole chain without a mouse.
if (location.hash.indexOf('demo') >= 0){
  setTimeout(() => {
    const infSel = document.getElementById('inf');
    if (location.hash.indexOf('nofill') >= 0) infSel.value = '0.00';
    document.getElementById('demo').click();
    setTimeout(() => {
      const m = state.map;
      if (!m) return;
      const F = (i, j, k) => (k*m.ny + j)*m.nx + i;
      // A storey is a wide stratum; a roof edge or a handrail top is a thin
      // one. Pick the widest stratum as the floor to start and finish on,
      // otherwise the goal lands on the roof and nothing can climb to it.
      const cnt = new Int32Array(m.nz);
      for (let k = 0; k < m.nz; ++k)
        for (let j = 0; j < m.ny; ++j)
          for (let i = 0; i < m.nx; ++i){
            const v = m.data[F(i, j, k)];
            if (v !== FREE && v !== INFL) continue;
            if (k < 1 || !m.supportOrUnknown(i, j, k)) continue;
            cnt[k]++;
          }
      let maxC = 0;
      for (let k = 0; k < m.nz; ++k) if (cnt[k] > maxC) maxC = cnt[k];
      let kLo = -1, kHi = -1;
      for (let k = 0; k < m.nz; ++k) if (cnt[k] >= maxC*0.5){ if (kLo < 0) kLo = k; kHi = k; }
      // Pick the most open cell on each of those two strata: a centroid can
      // land on a pillar or inside a handrail and leave the search in a pocket.
      function bestOn(k){
        let bi = -1, bj = -1, bn = -1;
        for (let j = 1; j < m.ny-1; ++j)
          for (let i = 1; i < m.nx-1; ++i){
            const v = m.data[F(i, j, k)];
            if (v !== FREE && v !== INFL) continue;
            if (!m.supportOrUnknown(i, j, k)) continue;
            let n = 0;
            for (let dj = -1; dj <= 1; ++dj)
              for (let di = -1; di <= 1; ++di){
                if (!di && !dj) continue;
                const v2 = m.data[F(i+di, j+dj, k)];
                if (v2 !== FREE && v2 !== INFL) continue;
                if (m.supportOrUnknown(i+di, j+dj, k)) ++n;
              }
            if (n > bn){ bn = n; bi = i; bj = j; }
          }
        return bn > 0 ? [bi, bj, k] : null;
      }
      const s0 = bestOn(kLo), g0 = bestOn(kHi);
      if (!s0 || !g0) return;
      const toWorld = v => [m.lo[0] + (v[0]+0.5)*m.res, m.lo[1] + (v[1]+0.5)*m.res,
                            m.lo[2] + (v[2]+0.5)*m.res];
      state.start = toWorld(s0);
      state.goal = toWorld(g0);
      markStart = makeBall(state.start, COL_S); root.add(markStart);
      markGoal = makeBall(state.goal, COL_G); root.add(markGoal);
      console.log('demo picks', s0, g0, 'strata', kLo, kHi);
      {
        const F2 = (i,j,k) => (k*m.ny+j)*m.nx+i;
        const fmt = [];
        for (let k = 0; k < m.nz; ++k) if (cnt[k] > 60) fmt.push(k + ':' + cnt[k]);
        console.log('wide strata', fmt.join(' '));
        const [si, sj, sk] = s0;
        let nb = '';
        for (let dk = -1; dk <= 1; ++dk) for (let dj = -1; dj <= 1; ++dj) for (let di = -1; di <= 1; ++di){
          if (!di && !dj && !dk) continue;
          const i = si+di, j = sj+dj, k = sk+dk;
          const v = m.data[F2(i,j,k)];
          const sup = m.supportOrUnknown(i,j,k) ? 's' : '-';
          nb += (v === FREE ? 'F' : v === INFL ? 'I' : v === OCC ? 'O' : 'U') + sup;
        }
        console.log('start cell', m.data[F2(si,sj,sk)], 'neighbours', nb);
      }
      document.getElementById('go').disabled = false;
      document.getElementById('go').click();
      // #demo,close pulls the camera in so a screenshot shows the floor plate
      // rather than the whole block
      if (location.hash.indexOf('close') >= 0){
        cam.dist = cam.dist * 0.45;
        cam.target.set(m.lo[0] + m.nx*m.res*0.5, m.lo[1] + m.ny*m.res*0.5,
                       m.lo[2] + 6*m.res*0.5);
        applyCam();
      }
    }, 500);
  }, 200);
}
